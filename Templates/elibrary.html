<!DOCTYPE html>
<html>
<head>
    <title>Digital E-Library</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            margin-top: 25px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
            background: white;
            color: black;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        th, td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #1f3c88;
            color: white;
        }

        tr:hover {
            background: #f2f2f2;
        }

        a {
            text-decoration: none;
            color: #1f3c88;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        a:hover {
            background: #1f3c88;
            color: white;
        }

        .back {
            margin-top: 20px;
            display: inline-block;
            color: white;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<h1>Digital E-Library</h1>

<div class="container">

    <table>
        <tr>
            <th>Book</th>
            <th>E-Book Link</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{book.title}}</td>
            <td>
                <a href="{{book.ebook}}" target="_blank">
                    📖 Open E-Book
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <a class="back" href="/">⬅ Back to Dashboard</a>

</div>

</body>
</html>
