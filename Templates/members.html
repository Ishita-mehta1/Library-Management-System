<!DOCTYPE html>
<html>
<head>
    <title>Members</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            margin-top: 25px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 20px;
            background: #ff4d6d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #e6004c;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
            color: black;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #ff4d6d;
            color: white;
        }

        a {
            text-decoration: none;
            color: #ff4d6d;
            font-weight: bold;
        }

        .back {
            margin-top: 20px;
            display: inline-block;
            color: white;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<h1>Members Management</h1>

<div class="container">

    <div class="form-box">
        <form action="/add_member" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Phone" required>
            <button type="submit">Add Member</button>
        </form>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Delete</th>
        </tr>

        {% for member in members %}
        <tr>
            <td>{{ member.id }}</td>
            <td>{{ member.name }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.phone }}</td>
            <td><a href="/delete_member/{{member.id}}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>

    <a class="back" href="/">⬅ Back to Dashboard</a>

</div>

</body>
</html>
