<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 30px;
            text-align: center;
        }

        nav {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        nav a:hover {
            background: white;
            color: #333;
        }

        .dashboard-container {
            text-align: center;
            margin-top: 30px;
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 320px;
        }

        .dashboard-container h2 {
            margin-bottom: 20px;
        }

        .stat {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            background: #f4f4f4;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>Library Management System</h1>

<nav>
    <a href="/books">Books</a>
    <a href="/members">Members</a>
    <a href="/elibrary">E-Library</a>
    <a href="/issue">Issued Books</a>
    <a href="/return">Return Book</a>
</nav>

<div class="dashboard-container">
    <h2>Dashboard</h2>

    <div class="stat">Total Books: {{ books|length }}</div>
    <div class="stat">Total Members: {{ members|length }}</div>
    <div class="stat">Total Issued Books: {{ loans|length }}</div>
</div>

</body>
</html>
